services:
  gluetun-a:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-a
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY_A}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES_A}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      # Allow the killswitch to return proxy responses to the internal subnet.
      - FIREWALL_OUTBOUND_SUBNETS=172.28.0.0/16
      - TZ=Europe/London
      - UPDATER_PERIOD=24h
    networks:
      - internal
      - wan
    volumes:
      - gluetun-a-data:/gluetun
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null https://am.i.mullvad.net/connected || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  gluetun-b:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-b
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY_B}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES_B}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      - FIREWALL_OUTBOUND_SUBNETS=172.28.0.0/16
      - TZ=Europe/London
      - UPDATER_PERIOD=24h
    networks:
      - internal
      - wan
    volumes:
      - gluetun-b-data:/gluetun
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null https://am.i.mullvad.net/connected || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  gluetun-c:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-c
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY_C}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES_C}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      - FIREWALL_OUTBOUND_SUBNETS=172.28.0.0/16
      - TZ=Europe/London
      - UPDATER_PERIOD=24h
    networks:
      - internal
      - wan
    volumes:
      - gluetun-c-data:/gluetun
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null https://am.i.mullvad.net/connected || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      gluetun-a:
        condition: service_healthy
      gluetun-b:
        condition: service_healthy
      gluetun-c:
        condition: service_healthy
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "8888:8888"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      searxng:
        condition: service_healthy

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=true
      - DOCKER_API_VERSION=1.40
      - TZ=Europe/London
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  # No WAN gateway — searxng/caddy sit here and cannot reach the internet
  # except via the gluetun proxies (fail-closed, no IP leak). Subnet pinned so
  # gluetun's killswitch can allow return traffic via FIREWALL_OUTBOUND_SUBNETS.
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
  # Normal bridge; only the gluetun containers attach here for tunnel egress.
  wan:
    driver: bridge

volumes:
  gluetun-a-data:
  gluetun-b-data:
  gluetun-c-data:
  caddy-data:
  caddy-config:
