use_default_settings: true

general:
  debug: false
  instance_name: "cloud-searxng"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "${SEARXNG_SECRET_KEY}"
  # Incoming abuse limiter is off: this instance is private (Tailscale-only, no
  # public ingress) and single-user. The limiter needs a Valkey/Redis backend it
  # doesn't have, so leaving it on only logged "limiter requires Valkey" errors.
  limiter: false
  image_proxy: true
  bind_address: "0.0.0.0"
  port: 8080

ui:
  static_use_hash: false
  default_locale: "en"
  query_in_title: false
  infinite_scroll: true
  center_alignment: true
  results_on_new_tab: false
  theme_args:
    simple_style: "auto"
  default_theme: simple

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  # Distribute outgoing engine requests across the gluetun proxy pool. httpx
  # round-robins the list per request, so a concurrent research burst spreads
  # across 3 Mullvad exit IPs instead of hammering one.
  proxies:
    all://:
      - http://gluetun-a:8888
      - http://gluetun-b:8888
      - http://gluetun-c:8888

engines:
  # Engine selection here is EMPIRICAL, measured from this instance on
  # 2026-07-31 (28 candidates, 3 queries, repeated runs, scored on whether
  # results actually matched the query). Everything egresses via the Mullvad
  # proxy pool, and the big-brand engines all treat those exits as hostile
  # traffic. Two failure modes matter, and only one of them is visible:
  #
  #   LOUD  — 403/429/CAPTCHA. Engine reports an error, SearXNG marks it
  #           unresponsive, results are merely missing. brave, duckduckgo,
  #           startpage, qwant, mojeek, yahoo, yep all do this here.
  #   QUIET — HTTP 200 with a plausible-looking page that is not our search.
  #           Nothing is logged, `unresponsive_engines` stays empty, and the
  #           junk is merged into the ranking as if it were good. Far worse.
  #
  # bing and google both fail QUIETLY from this instance, so both are off.
  # Note upstream's own defaults already have bing `disabled` and google
  # `inactive`; a previous commit here force-enabled both. That fought
  # upstream's assessment and lost — do not re-enable them without re-running
  # the measurement.

  # Bing: serves DECOY results to non-residential IPs. Returns 200, echoes the
  # query back correctly, and renders 10 well-formed b_algo blocks of results
  # for a completely different query — observed junk included Power BI, Baidu
  # Zhidao, Outlook, AliExpress, a Moroccan university, and (for "caldigit")
  # ten adult-content results for the unrelated term "bjhouse". Verified as an
  # IP-reputation response, not a request defect: byte-identical requests score
  # 9/9 relevant from a residential IP and 0/10 from all 3 Mullvad exits AND
  # from the OCI datacenter IP with the VPN bypassed. Cookie warm-up (full
  # MUID/_EDGE_S set), form=QBLH, mkt=en-GB and matching Accept-Language were
  # all tested and changed nothing. It intermittently works (~1 run in 3),
  # which is why this went unnoticed — with weight 1.2 it was outranking good
  # results. There is no way to call it correctly from here.
  - name: bing
    engine: bing
    shortcut: bi
    disabled: true

  # Google: served the "enable JavaScript" interstitial on every request from
  # every exit. searx/engines/google.py `detect_google_sorry()` only recognises
  # /sorry/ CAPTCHA pages, so this block page is parsed as a normal SERP,
  # yields nothing, and returns 0 results with NO error and NO log line.
  # Matches upstream's `inactive: true` default. `inactive` (not `disabled`)
  # keeps it out of the init path entirely.
  - name: google
    engine: google
    inactive: true

  # --- Primary general engines: measured reliable AND relevant from here ---
  # Each returned results on every run and scored >=0.90 relevant. They are
  # mutually independent (pairwise Jaccard < 0.6 on result URLs), which matters
  # because SearXNG's score multiplies by the number of engines agreeing on a
  # result — independent agreement is a real quality signal, whereas several
  # front-ends onto one index would just amplify a single provider's opinion.

  # DuckDuckGo's HTML endpoint. Distinct from the `duckduckgo` engine below:
  # that one uses the JSON API and gets 403d on these exits, while this one is
  # unaffected. Scored 30/30. This is the closest thing to a mainstream index
  # that works from here.
  - name: duckduckgo web
    engine: duckduckgo_web
    shortcut: ddgw
    weight: 1.5
    disabled: false

  # Google results via the Programmable Search JSON path — reaches Google's
  # index without tripping the bot interstitial that kills the `google` engine.
  # Scored 57/60 and consistently returns 20 results. Previously disabled here
  # for 429s; re-measured and it is now the strongest performer, so it is back.
  - name: google cse
    engine: google_cse
    shortcut: goc
    weight: 1.5
    disabled: false

  # Scored 56/56, ~18 results/run, 15 distinct hosts.
  - name: resulthunter
    engine: resulthunter
    shortcut: reh
    weight: 1.2
    disabled: false

  # Scored 29/30.
  - name: privacywall
    engine: privacywall
    shortcut: pw
    weight: 1.0
    disabled: false

  # Scored 30/30.
  - name: gmx
    engine: gmx
    shortcut: gmx
    weight: 1.0
    disabled: false

  # Scored 27/30. Czech index — adds genuinely different coverage.
  - name: seznam
    engine: seznam
    shortcut: szn
    weight: 0.9
    disabled: false

  # Scored 27/27.
  - name: zapmeta
    engine: xpath
    shortcut: zpm
    weight: 0.9
    disabled: false

  # dogpile and searchtoday both scored ~0.96 but overlap each other (Jaccard
  # 0.52), so only dogpile is enabled — searchtoday would mostly duplicate its
  # votes. infospace shares searchtoday's `s1search` engine and is left off for
  # the same reason. Any of them can still be reached by bang (!std, !ifs).
  - name: dogpile
    engine: dogpile
    shortcut: dog
    weight: 0.9
    disabled: false

  # --- Kept enabled: intermittent but LOUD when they fail ---
  # Both 403/429 on these exits much of the time. That is acceptable because
  # the failure is reported rather than silently poisoning results, and when
  # they do answer the results are good. They also self-recover.
  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    weight: 1.0

  - name: brave
    engine: brave
    shortcut: br
    weight: 1.0

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    weight: 0.8

  - name: github
    engine: github
    shortcut: gh
    weight: 0.8

  # Startpage CAPTCHAs shared VPN exit IPs on every request (1h cooldown), so it
  # never returns results here. Disable the default-settings entry.
  - name: startpage
    engine: startpage
    disabled: true

  # Wikidata's init SPARQL query to query.wikidata.org 403s because Wikimedia
  # (WDQS) blocks any User-Agent starting with "SearXNG/" — the stock Docker
  # image's default UA. Not a VPN issue (reproduces without a proxy) and no
  # config workaround exists: useragent_suffix only appends, can't change the
  # blocked prefix. Upstream fix (caching init data) is unreleased. See
  # searxng/searxng#6454. Wikipedia already covers the encyclopedic case.
  # NOTE: `inactive` (not `disabled`) — only `inactive` skips engine init();
  # `disabled` still runs init(), which re-triggers the 403 on every startup.
  - name: wikidata
    engine: wikidata
    inactive: true

  # Default-settings engines we don't use that fail to init on this box and only
  # add startup log noise: ahmia/torch are Tor onion engines (no tor proxy here),
  # radio browser can't resolve its host. `inactive` skips init entirely.
  - name: ahmia
    engine: ahmia
    inactive: true

  - name: torch
    engine: xpath
    inactive: true

  - name: radio browser
    engine: radio_browser
    inactive: true

  # ===================================================================
  # Non-general categories, audited 2026-07-31 by the same method: every
  # enabled engine bang-tested through the live instance, then classified.
  #
  # Good news first: NO other engine reproduces bing web's decoy behaviour.
  # bing images/videos/news use different endpoints and return correct,
  # relevant results, so they stay. 52 engines passed unchanged.
  #
  # The engines below returned HTTP 200 and zero results with NO error and
  # NO log line — the same QUIET class as bing/google, just caused by bot
  # walls rather than decoys. Each was confirmed in-process against the
  # engine's own request()/response() code. Left enabled they are dead
  # weight that looks healthy; `disabled` keeps them bang-callable so a
  # future recheck is one query away.

  # PyPI and Bandcamp both sit behind the same JS interstitial — a 3036-byte
  # page titled "Client Challenge" asking to enable JavaScript. Identical
  # byte count from both hosts, so it is one vendor's product. No headless
  # browser here, so it cannot be satisfied.
  - name: pypi
    engine: pypi
    shortcut: pypi
    disabled: true

  - name: bandcamp
    engine: bandcamp
    shortcut: bc
    disabled: true

  # Arch Wiki now runs Anubis, a proof-of-work anti-AI-scraper wall
  # ("Making sure you're not a bot!"). Requires solving a JS PoW challenge.
  # `free software directory` and `gentoo` cover software-wiki queries.
  - name: arch linux wiki
    engine: archlinux
    shortcut: al
    disabled: true

  # solidtorrents.to redirects to bitsearch.eu, whose markup no longer
  # matches the engine's parser — 163KB of HTML, 0 results extracted.
  # Upstream engine needs updating; btdigg/nyaa/piratebay cover this.
  - name: solidtorrents
    engine: solidtorrents
    shortcut: solid
    disabled: true

  # etymonline is an `xpath` engine whose selectors no longer match the
  # site. wiktionary + wordnik already cover dictionary lookups.
  - name: etymonline
    engine: xpath
    shortcut: et
    disabled: true

  # The public lingva.ml instance returns HTTP errors (dead deployment).
  # dictzone and mymemory translated both work and stay enabled — note
  # translate engines need "en-de word" syntax, not a bare word.
  - name: lingva
    engine: lingva
    shortcut: lv
    disabled: true

  # --- Replacements, all verified relevant AND reliable over repeat runs ---

  # Package registries (crates.io !crates, npm !npm, pkg.go.dev !pgo, alpine
  # !alp, packagist !pack, hex !hex) were trialled here as enabled and then
  # DELIBERATELY LEFT DISABLED — upstream's default, and it is correct.
  #
  # They answer accurately when asked directly (10/10 to 50/50 relevant by
  # bang), but each only knows its own language's index, so it always returns
  # *something* regardless of the query. Blended into a category search that
  # ranks Elixir and Rust packages above the actual answer: measured
  # "docker compose healthcheck syntax" -> 9 of the top 10 results were
  # irrelevant hex/crates packages, and "postgres explain analyze slow query"
  # the same. That is the exact pollution this audit set out to remove, so
  # they are reachable by bang only. Do not enable them for category search.

  # software wikis: replaces arch linux wiki.
  - name: free software directory
    engine: mediawiki
    shortcut: fsd
    disabled: false

  - name: wikibooks
    engine: mediawiki
    shortcut: wb
    disabled: false

  # it/news: Hacker News is strong for technical discussion and unaffected
  # by any of the bot walls above.
  - name: hackernews
    engine: hackernews
    shortcut: hn
    disabled: false

  # music: replaces bandcamp.
  - name: deezer
    engine: deezer
    shortcut: dz
    disabled: false

  # videos: brave.videos and vimeo are persistently blocked from these
  # exits, so add sources that are not.
  - name: peertube
    engine: peertube
    shortcut: ptb
    disabled: false

  - name: odysee
    engine: odysee
    shortcut: od
    disabled: false

  # files: replaces solidtorrents and kickass (kickass 403s persistently).
  - name: btdigg
    engine: btdigg
    shortcut: bt
    disabled: false

  - name: nyaa
    engine: nyaa
    shortcut: nt
    disabled: false

  # science: crossref and openalex are open scholarly indexes, no bot walls.
  - name: crossref
    engine: crossref
    shortcut: cr
    disabled: false

  - name: openalex
    engine: openalex
    shortcut: oa
    disabled: false

  # dictionaries: replaces etymonline.
  - name: duden
    engine: duden
    shortcut: du
    disabled: false

  # icons: 325/325 relevant, complements devicons/lucide.
  - name: material icons
    engine: material_icons
    shortcut: mi
    disabled: false

  # NOT changed, deliberately: openstreetmap, vimeo, genius, reuters,
  # google news, startpage images/news, unsplash, deviantart, kickass and
  # brave.{images,videos,news} all fail LOUDLY here (403/429/CAPTCHA), so
  # SearXNG reports them unresponsive rather than merging bad data. They
  # cost coverage, not correctness, and they self-recover — unlike bing,
  # which silently poisoned the ranking. Left enabled on purpose.
  #
  # Also unchanged: `photon` covers map queries while osm is blocked, and
  # bing images/videos/news are measurably fine (34/49, 30/30, 10/10).
