use_default_settings: true

general:
  debug: false
  instance_name: "cloud-searxng"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "${SEARXNG_SECRET_KEY}"
  # Incoming abuse limiter is off: this instance is private (Tailscale-only, no
  # public ingress) and single-user. The limiter needs a Valkey/Redis backend it
  # doesn't have, so leaving it on only logged "limiter requires Valkey" errors.
  limiter: false
  image_proxy: true
  bind_address: "0.0.0.0"
  port: 8080

ui:
  static_use_hash: false
  default_locale: "en"
  query_in_title: false
  infinite_scroll: true
  center_alignment: true
  results_on_new_tab: false
  theme_args:
    simple_style: "auto"
  default_theme: simple

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  # Distribute outgoing engine requests across the gluetun proxy pool. httpx
  # round-robins the list per request, so a concurrent research burst spreads
  # across 3 Mullvad exit IPs instead of hammering one.
  proxies:
    all://:
      - http://gluetun-a:8888
      - http://gluetun-b:8888
      - http://gluetun-c:8888

engines:
  # Upstream flipped the default flags on these two reliable engines
  # (2026.7.26: google -> inactive, bing -> disabled). With
  # use_default_settings, an override that omits the flag INHERITS the new
  # default, so both silently dropped out and search returned no results.
  # Pin the flags explicitly so an upstream default flip can't disable them.
  - name: google
    engine: google
    shortcut: g
    weight: 1.5
    inactive: false
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    weight: 1.2
    inactive: false
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    weight: 1.0

  - name: brave
    engine: brave
    shortcut: br
    weight: 1.0

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    weight: 0.8

  - name: github
    engine: github
    shortcut: gh
    weight: 0.8

  # Startpage CAPTCHAs shared VPN exit IPs on every request (1h cooldown), so it
  # never returns results here. Disable the default-settings entry.
  - name: startpage
    engine: startpage
    disabled: true

  # google cse became a default-on engine in 2026.7.26. It 429s on the shared
  # Mullvad exits ("unusual traffic from your network") and only adds failure
  # noise — the standard `google` engine above is the reliable one. Disable it.
  - name: google cse
    engine: google_cse
    disabled: true

  # Wikidata's init SPARQL query to query.wikidata.org 403s because Wikimedia
  # (WDQS) blocks any User-Agent starting with "SearXNG/" — the stock Docker
  # image's default UA. Not a VPN issue (reproduces without a proxy) and no
  # config workaround exists: useragent_suffix only appends, can't change the
  # blocked prefix. Upstream fix (caching init data) is unreleased. See
  # searxng/searxng#6454. Wikipedia already covers the encyclopedic case.
  # NOTE: `inactive` (not `disabled`) — only `inactive` skips engine init();
  # `disabled` still runs init(), which re-triggers the 403 on every startup.
  - name: wikidata
    engine: wikidata
    inactive: true

  # Default-settings engines we don't use that fail to init on this box and only
  # add startup log noise: ahmia/torch are Tor onion engines (no tor proxy here),
  # radio browser can't resolve its host. `inactive` skips init entirely.
  - name: ahmia
    engine: ahmia
    inactive: true

  - name: torch
    engine: xpath
    inactive: true

  - name: radio browser
    engine: radio_browser
    inactive: true
