use_default_settings: true

general:
  debug: false
  instance_name: "cloud-searxng"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "${SEARXNG_SECRET_KEY}"
  # Incoming abuse limiter is off: this instance is private (Tailscale-only, no
  # public ingress) and single-user. The limiter needs a Valkey/Redis backend it
  # doesn't have, so leaving it on only logged "limiter requires Valkey" errors.
  limiter: false
  image_proxy: true
  bind_address: "0.0.0.0"
  port: 8080

ui:
  static_use_hash: false
  default_locale: "en"
  query_in_title: false
  infinite_scroll: true
  center_alignment: true
  results_on_new_tab: false
  theme_args:
    simple_style: "auto"
  default_theme: simple

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 20
  # Distribute outgoing engine requests across the gluetun proxy pool. httpx
  # round-robins the list per request, so a concurrent research burst spreads
  # across 3 Mullvad exit IPs instead of hammering one.
  proxies:
    all://:
      - http://gluetun-a:8888
      - http://gluetun-b:8888
      - http://gluetun-c:8888

engines:
  - name: google
    engine: google
    shortcut: g
    weight: 1.5

  - name: bing
    engine: bing
    shortcut: b
    weight: 1.2

  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    weight: 1.0

  - name: brave
    engine: brave
    shortcut: br
    weight: 1.0

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    weight: 0.8

  - name: github
    engine: github
    shortcut: gh
    weight: 0.8

  # Startpage CAPTCHAs shared VPN exit IPs on every request (1h cooldown), so it
  # never returns results here. Disable the default-settings entry.
  - name: startpage
    engine: startpage
    disabled: true

  # Wikidata's init SPARQL query to query.wikidata.org 403s because Wikimedia
  # (WDQS) blocks any User-Agent starting with "SearXNG/" — the stock Docker
  # image's default UA. Not a VPN issue (reproduces without a proxy) and no
  # config workaround exists: useragent_suffix only appends, can't change the
  # blocked prefix. Upstream fix (caching init data) is unreleased. See
  # searxng/searxng#6454. Wikipedia already covers the encyclopedic case.
  # NOTE: `inactive` (not `disabled`) — only `inactive` skips engine init();
  # `disabled` still runs init(), which re-triggers the 403 on every startup.
  - name: wikidata
    engine: wikidata
    inactive: true
